<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Tube Scholar: turn any YouTube video into a study guide">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1418"/>
      <stop offset="1" stop-color="#132126"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#3DC1AF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3DC1AF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#24333B"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#dots)"/>
  <rect width="1280" height="400" fill="url(#glow)"/>

  <!-- agent network motif -->
  <g stroke="#3DC1AF" stroke-opacity="0.35" stroke-width="1.2" fill="none">
    <path d="M880 90 L990 150 L1110 105 M990 150 L960 260 L1090 300 L1110 105 M960 260 L860 230 L880 90 M1090 300 L1190 220 L1110 105"/>
  </g>
  <g fill="#3DC1AF">
    <circle cx="880" cy="90" r="5" fill-opacity="0.55"/>
    <circle cx="990" cy="150" r="7"/>
    <circle cx="1110" cy="105" r="5" fill-opacity="0.55"/>
    <circle cx="960" cy="260" r="5" fill-opacity="0.55"/>
    <circle cx="1090" cy="300" r="7"/>
    <circle cx="860" cy="230" r="4" fill-opacity="0.45"/>
    <circle cx="1190" cy="220" r="4" fill-opacity="0.45"/>
  </g>

  <!-- play badge -->
  <rect x="96" y="108" width="74" height="52" rx="14" fill="#E0201B"/>
  <path d="M124 120 L124 148 L148 134 Z" fill="#fff"/>

  <text x="190" y="152" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#E3EBEE">Tube Scholar</text>
  <text x="98" y="222" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="27" fill="#93A2A9">Paste a YouTube link. Get a study guide you can learn from</text>
  <text x="98" y="258" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="27" fill="#93A2A9">without watching the video.</text>

  <g font-family="IBM Plex Mono, SFMono-Regular, Menlo, monospace" font-size="15" fill="#3DC1AF">
    <rect x="98" y="296" width="118" height="32" rx="16" fill="none" stroke="#24333B"/>
    <text x="157" y="317" text-anchor="middle">ARABIC + EN</text>
    <rect x="228" y="296" width="150" height="32" rx="16" fill="none" stroke="#24333B"/>
    <text x="303" y="317" text-anchor="middle">FACT-CHECKED</text>
    <rect x="390" y="296" width="170" height="32" rx="16" fill="none" stroke="#24333B"/>
    <text x="475" y="317" text-anchor="middle">TIMESTAMP-LINKED</text>
    <rect x="572" y="296" width="190" height="32" rx="16" fill="none" stroke="#24333B"/>
    <text x="667" y="317" text-anchor="middle">CLAUDE CODE SKILL</text>
  </g>
</svg>
